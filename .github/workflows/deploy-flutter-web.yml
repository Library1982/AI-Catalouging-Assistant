name: Build and publish MARC AI Assistant

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marc-ai-github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /AI-Catalouging-Assistant/ --pwa-strategy=none

      - name: Deploy to existing gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
